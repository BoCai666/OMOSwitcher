[package]
name = "omoswitcher"
version = "2.0.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-keyring = { git = "https://github.com/HuakunShen/tauri-plugin-keyring" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
notify = "8"
notify-debouncer-full = "0.5"
hudsucker = { version = "0.24", features = ["rcgen-ca", "rustls-client"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
rand = "0.8"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2.1"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
