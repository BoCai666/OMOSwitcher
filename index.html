<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMOSwitcher - OhMyOpenCode 模型配置管理</title>
    <!-- 内联 SVG favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300ffff'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%231a1a2e'>O</text></svg>" />
    <!-- 阻塞脚本：在 CSS 加载前设置主题 class，防止 FOUC -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <!-- 预加载动画样式 -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 与 Tauri 原生窗口 backgroundColor 一致，避免白闪 */
        background-color: #1a1a2e;
      }
      #preload-loading {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        /* 预加载动画独占背景色，不受 global.css 覆盖影响 */
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      }
      /* 玻璃拟态主题预加载背景 */
      html.glassmorphism #preload-loading {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
      }
      .preload-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .preload-logo {
        width: 80px;
        height: 80px;
        color: #00ffff;
      }
      .preload-logo svg {
        width: 100%;
        height: 100%;
        animation: preload-spin 1.5s linear infinite;
      }
      @keyframes preload-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .preload-text {
        font-size: 28px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .preload-spinner {
        display: flex;
        gap: 8px;
      }
      .preload-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00ffff;
        animation: preload-bounce 1.4s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
      }
      .preload-dot:nth-child(1) { animation-delay: 0s; }
      .preload-dot:nth-child(2) { animation-delay: 0.2s; }
      .preload-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes preload-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
        40% { transform: scale(1); opacity: 1; }
      }
      /* 玻璃拟态主题 */
      html.glassmorphism .preload-text {
        color: #1e293b;
        text-shadow: none;
      }
      html.glassmorphism .preload-logo {
        color: #2563eb;
      }
      html.glassmorphism .preload-dot {
        background: #2563eb;
        box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
      }
    </style>
  </head>
  <body>
    <!-- 预加载动画：Vue 加载前显示 -->
    <div id="preload-loading">
      <div class="preload-content">
        <div class="preload-logo">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" opacity="0.2"/>
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" stroke-dasharray="80" stroke-dashoffset="60"/>
          </svg>
        </div>
        <div class="preload-text">OMOSwitcher</div>
        <div class="preload-spinner">
          <div class="preload-dot"></div>
          <div class="preload-dot"></div>
          <div class="preload-dot"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
